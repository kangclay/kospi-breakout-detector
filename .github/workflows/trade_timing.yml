name: Independent Trade Timing Engine

on:
  workflow_run:
    workflows: ["Daily Multi-Factor Screener"]
    types: [completed]
  workflow_dispatch:

jobs:
  timing:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Restore Google Sheets key
        env:
          GSHEET_KEY: ${{ secrets.GSHEET_KEY }}
        run: |
          test -n "$GSHEET_KEY"
          echo "$GSHEET_KEY" | base64 -d > gsheet_key.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run independent timing engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python timing_runner.py --write-sheet --notify

      - name: Upload independent timing report
        uses: actions/upload-artifact@v4
        with:
          name: independent-timing-reports
          path: reports/timing/
          if-no-files-found: error
