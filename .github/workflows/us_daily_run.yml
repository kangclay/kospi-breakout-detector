name: US Daily Price-Factor Screener

on:
  schedule:
    # 08:20 KST Tue-Sat / 23:20 UTC Mon-Fri: safely after the US close year-round.
    - cron: '20 23 * * 1-5'
  workflow_dispatch:

jobs:
  us-detector:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Restore Google Sheets key
        env:
          GSHEET_KEY: ${{ secrets.GSHEET_KEY }}
        run: |
          if [ -z "$GSHEET_KEY" ]; then
            echo "GSHEET_KEY is required"
            exit 1
          fi
          echo "$GSHEET_KEY" | base64 -d > gsheet_key.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run US daily screener
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u us_screener.py \
            --notify \
            --log-sheet \
            --min-score 82 \
            --off-watch-min-score 88 \
            --top-n 10
